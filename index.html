    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Comic Sans MS', 'Rounded Mplus 1c', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #1a0b2e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container formato Mobile */
    #app-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      background: linear-gradient(180deg, #ffd6f5 0%, #e4c1f9 60%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(255, 0, 160, 0.5);
    }

    /* Cenários dinâmicos atrás do Canvas 3D */

    .bg-stage-1 { background: linear-gradient(180deg, #b8e8fc 0%, #ddf3ff 50%, #b8e8fc 100%); background-size: 30px 30px; }
    .bg-stage-2 { background: linear-gradient(180deg, #ffb3d9 0%, #ffd9ec 45%, #88d49e 90%); }
    .bg-stage-3 { background: radial-gradient(circle at 50% 30%, #ff00a0 0%, #4a0e78 55%, #120428 100%); }
    .bg-stage-4 { background: linear-gradient(180deg, #e5c6ff 0%, #f7d6ff 60%, #d4a5ff 100%); }
    .bg-stage-5 { background: linear-gradient(180deg, #72efdd 0%, #64dfdf 50%, #5390d9 100%); }

    /* Área 3D Superior */
    #viewport-container {
      position: relative;
      width: 100%;
      height: 58%;
      flex-shrink: 0;
      touch-action: none;
    }

    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Placa com nome da jogadora e dica 360 */

      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #ff5ca8;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 800;
      color: #b5179e;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.78);
      color: #8338ec;
      padding: 3px 12px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: bold;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);

    /* Colunas de Botões Laterais (Padrão das Imagens de Referência) */

      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 15;
    }
    .side-buttons.left { left: 12px; }
    .side-buttons.right { right: 12px; }

      height: 44px;

      border: 3px solid #ffffff;

      color: white;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;

    .pink-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d63384;
    }

<script>
  /**************************************************************
   * 1. SINTETIZADOR DE ÁUDIO K-POP (WEB AUDIO API - SEM MP3 EXTERNO)
   **************************************************************/
  class KpopAudioEngine {
    constructor() {
      this.ctx = null;
      this.isPlaying = false;
      this.tempo = 132;
      this.step = 0;
      this.timer = null;
      this.songIndex = 0;
      this.melodies = [
        // Música 1: Huntrix Pop Star
        [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33,
         523.25, 659.25, 783.99, 1046.50, 987.77, 783.99, 659.25, 783.99],
        // Música 2: Guerreiras Neon
        [440.00, 523.25, 659.25, 880.00, 783.99, 659.25, 523.25, 587.33,
         659.25, 659.25, 880.00, 783.99, 659.25, 523.25, 493.88, 440.00]
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playPopSound(freq = 600) {
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.6, this.ctx.currentTime + 0.09);

      gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    }

    playSparkle() {
      this.init();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => {
        setTimeout(() => this.playPopSound(n), i * 55);
      });
    }

    toggleMusic() {
      this.init();
      if (this.isPlaying) {
        this.songIndex = (this.songIndex + 1) % (this.melodies.length + 1);
        if (this.songIndex === this.melodies.length) {
          this.stopMusic();
          return false;
        }
      } else {
        this.songIndex = 0;
        this.startMusic();
      }
      return true;
    }

    startMusic() {
      this.init();
      if (this.timer) clearInterval(this.timer);
      this.isPlaying = true;
      const interval = (60 / this.tempo) * 500;
      this.timer = setInterval(() => {
        if (!this.isPlaying) return;
        const notes = this.melodies[this.songIndex % this.melodies.length];
        const freq = notes[this.step % notes.length];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = (this.step % 2 === 0) ? 'square' : 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.19);

        this.step++;
      }, interval);
    }

    stopMusic() {
      this.isPlaying = false;
      if (this.timer) clearInterval(this.timer);
    }
  }

  // Gerador de Textura de Rosto Anime em Canvas 2D
  function createFaceTexture(expression, skinHex) {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext('2d');

    // Fundo da pele
    ctx.fillStyle = skinHex;
    ctx.fillRect(0, 0, 512, 512);

    // Bochechas rosadas fofas
    ctx.fillStyle = 'rgba(255, 105, 180, 0.35)';
    ctx.beginPath();
    ctx.ellipse(160, 300, 32, 18, 0, 0, Math.PI * 2);
    ctx.ellipse(352, 300, 32, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sobrancelhas
    ctx.strokeStyle = '#3d1e4d';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(175, 210, 35, Math.PI * 1.2, Math.PI * 1.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(337, 210, 35, Math.PI * 1.2, Math.PI * 1.8);
    ctx.stroke();

    // Função auxiliar para desenhar olho grande de Anime
    function drawAnimeEye(cx, cy, isWink, isStar) {
      if (isWink) {
        ctx.strokeStyle = '#240046';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(cx, cy + 5, 32, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
        return;
      }

      // Esclera branca
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 38, 42, 0, 0, Math.PI * 2);
      ctx.fill();

      // Íris roxa/brilhante K-Pop
      const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 34);
      grad.addColorStop(0, '#5a189a');
      grad.addColorStop(0.6, '#9d4edd');
      grad.addColorStop(1, '#240046');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, 30, 34, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pupila
      ctx.fillStyle = '#10002b';
      ctx.beginPath();
      ctx.arc(cx, cy + 4, 14, 0, Math.PI * 2);
      ctx.fill();

      // Brilho branco
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx - 12, cy - 12, 10, 0, Math.PI * 2);
      ctx.arc(cx + 12, cy + 12, 5, 0, Math.PI * 2);
      ctx.fill();

      if (isStar) {
        ctx.fillStyle = '#ffea00';
        ctx.font = '26px sans-serif';
        ctx.fillText('★', cx - 12, cy + 10);
      }

      // Cílios superiores
      ctx.strokeStyle = '#10002b';
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(cx, cy, 39, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
    }

    drawAnimeEye(180, 250, expression === 'wink', expression === 'star');
    drawAnimeEye(332, 250, false, expression === 'star');

    // Boca
    ctx.strokeStyle = '#6a040f';
    ctx.lineWidth = 7;
    if (expression === 'tongue') {
      ctx.beginPath();
      ctx.arc(256, 315, 22, 0, Math.PI);
      ctx.stroke();
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(264, 326, 11, 0, Math.PI);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(256, 312, 24, 0, Math.PI);
      ctx.fill();
      ctx.stroke();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  // Constrói o Corpo Base Chibi (Manequim 3D)

    headMesh.rotation.y = -Math.PI / 2;
    headGroup.add(headMesh);

    // Orelhas
    const earGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const leftEar = new THREE.Mesh(earGeo, skinMat);
    leftEar.position.set(-0.88, 0, 0);

    rightEar.position.set(0.88, 0, 0);
    headGroup.add(leftEar, rightEar);

    // Pescoço e Tronco Chibi

    // Braços Articulados

    leftArmPivot.position.set(-0.38, 0.5, 0);

    leftHand.position.set(-0.24, -0.65, 0);

  function refreshCharacter3D() {
    buildBaseBody();
    updateHair();
    updateOutfits();
    const app = document.getElementById('app-container');
    app.className = `bg-stage-${currentState.bg}`;
  }

  /**************************************************************
   * 4. ROTAÇÃO 360° POR TOQUE / MOUSE E LOOP DE ANIMAÇÃO
   **************************************************************/
  let isDragging = false;
  let prevX = 0;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || e.target.closest('#color-palette-popup')) return;
    isDragging = true;
    prevX = e.clientX;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - prevX;
    prevX = e.clientX;
    characterGroup.rotation.y += deltaX * 0.014;
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Respiração suave e balanço K-Pop
    characterGroup.position.y = Math.sin(t * 2.5) * 0.04;
    headGroup.rotation.z = Math.sin(t * 1.8) * 0.035;

    // Aceno sorridente da Rummi na tela inicial
    if (rightArmPivot) {
      if (isWaving) {
        rightArmPivot.rotation.z = 2.2 + Math.sin(t * 8) * 0.28;
      } else {
        rightArmPivot.rotation.z = Math.sin(t * 2) * 0.06;
      }
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = viewport.clientWidth / viewport.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  });

  /**************************************************************
   * 5. INTERFACE DE USUÁRIO E CONTROLES (PT-BR)
   **************************************************************/
  function renderCategories() {
    const bar = document.getElementById('category-bar');
    bar.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('div');
      btn.className = `cat-tab ${cat.id === activeCategory ? 'active' : ''}`;
      btn.innerHTML = cat.icon;
      btn.title = cat.name;
      btn.onclick = () => {
        audio.playPopSound(650);
        activeCategory = cat.id;
        renderCategories();
        renderItemsGrid();
      };
      bar.appendChild(btn);
    });
  }

  function renderItemsGrid() {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = '';
    const list = ITEMS_DB[activeCategory] || [];

    list.forEach(item => {
      const card = document.createElement('div');
      let isSelected = false;

      if (activeCategory === 'face') {
        isSelected = (currentState.face === item.id);
      } else {
        isSelected = (currentState[activeCategory] === item.id);
      }

      card.className = `item-card ${isSelected ? 'selected' : ''}`;
      card.innerHTML = `
        <div class="item-icon">${item.icon}</div>
        <div class="item-label">${item.label}</div>
      `;

      card.onclick = () => {
        audio.playPopSound(780);
        applyItemSelection(activeCategory, item.id);
        renderItemsGrid();
      };
      grid.appendChild(card);
    });
  }

  function applyItemSelection(cat, itemId) {
    if (cat === 'face') {
      if (itemId.startsWith('skin_')) {
        const skinMap = {
          skin_light: '#ffe0bd',
          skin_warm: '#f1c27d',
          skin_tan: '#c68642',
          skin_dark: '#8d5524'
        };
        currentState.skin = skinMap[itemId];
      } else {
        currentState.face = itemId;
      }
    } else if (cat === 'top' || cat === 'bottom') {
      currentState[cat] = itemId;
      if (itemId !== 'none') currentState.dress = 'none';
    } else if (cat === 'dress') {
      currentState.dress = itemId;
    } else {
      currentState[cat] = itemId;
    }
    refreshCharacter3D();
  }

  // Paleta de 18 Cores Lateral
  function initColorPalette() {
    const popup = document.getElementById('color-palette-popup');
    popup.innerHTML = '';
    PALETTE_COLORS.forEach(hex => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch';
      sw.style.background = hex;
      sw.onclick = () => {
        audio.playPopSound(880);
        if (activeCategory === 'hair') currentState.hairColor = hex;
        else if (activeCategory === 'top') currentState.topColor = hex;
        else if (activeCategory === 'dress') currentState.dressColor = hex;
        else if (activeCategory === 'bottom') currentState.bottomColor = hex;
        else if (activeCategory === 'shoes') currentState.shoesColor = hex;
        else if (activeCategory === 'acc') currentState.accColor = hex;
        else currentState.hairColor = hex;
        refreshCharacter3D();
      };
      popup.appendChild(sw);
    });
  }

  // Eventos dos Botões Superiores
  document.getElementById('start-play-btn').onclick = () => {
    const nameVal = document.getElementById('player-name-input').value.trim();
    const playerName = nameVal ? nameVal : 'Estrela';
    document.getElementById('top-banner').textContent = `✨ Camarim da ${playerName} ✨`;
    document.getElementById('start-screen').classList.add('hidden');
    isWaving = false;
    audio.playSparkle();
    audio.startMusic();
  };

  // Botão Retorno Tela Inicial
  document.getElementById('btn-home').onclick = () => {
    audio.playPopSound(450);
    const app = document.getElementById('app-container');
    if (app.classList.contains('photo-mode')) {
      app.classList.remove('photo-mode');
      setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
      return;
    }
    isWaving = true;
    characterGroup.rotation.y = 0;
    document.getElementById('start-screen').classList.remove('hidden');
  };

  // Botão Lixeira (Manequim Base igual à imagem 2 e 10)
  document.getElementById('btn-reset').onclick = () => {
    audio.playPopSound(380);
    currentState.hair = 'none';
    currentState.top = 'none';
    currentState.dress = 'none';
    currentState.bottom = 'shorts_kpop';
    currentState.shoes = 'none';
    currentState.acc = 'none';
    refreshCharacter3D();
    renderItemsGrid();
  };

  // Botão Dado (Visual Aleatório)
  document.getElementById('btn-random').onclick = () => {
    audio.playSparkle();
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    currentState.hair = pick(ITEMS_DB.hair.slice(1)).id;
    currentState.hairColor = pick(PALETTE_COLORS);

    if (Math.random() > 0.45) {
      currentState.dress = 'none';
      currentState.top = pick(ITEMS_DB.top.slice(1)).id;
      currentState.topColor = pick(PALETTE_COLORS);
      currentState.bottom = pick(ITEMS_DB.bottom.slice(1)).id;
      currentState.bottomColor = pick(PALETTE_COLORS);
    } else {
      currentState.dress = pick(ITEMS_DB.dress.slice(1)).id;
      currentState.dressColor = pick(PALETTE_COLORS);
    }

    currentState.shoes = pick(ITEMS_DB.shoes.slice(1)).id;
    currentState.shoesColor = pick(PALETTE_COLORS);
    currentState.acc = pick(ITEMS_DB.acc.slice(1)).id;
    currentState.accColor = pick(PALETTE_COLORS);
    currentState.bg = pick(ITEMS_DB.bg).id;

    refreshCharacter3D();
    renderItemsGrid();
  };

  // Botão Música
  document.getElementById('btn-music').onclick = (e) => {
    const active = audio.toggleMusic();
    e.currentTarget.textContent = active ? '🎵' : '🔇';
  };

  // Botão Confirmar / Modo Foto
  document.getElementById('btn-photo').onclick = () => {
    audio.playSparkle();
    const app = document.getElementById('app-container');
    app.classList.toggle('photo-mode');
    isWaving = true;
    setTimeout(() => {
      window.dispatchEvent(new Event('resize'));
      setTimeout(() => { isWaving = false; }, 2200);
    }, 50);
  };

  // Botão Personagens Guerreiras Huntrix
  document.getElementById('btn-preset').onclick = () => {
    audio.playSparkle();
    presetIndex = (presetIndex + 1) % HUNTRIX_PRESETS.length;
    currentState = JSON.parse(JSON.stringify(HUNTRIX_PRESETS[presetIndex]));
    document.getElementById('top-banner').textContent = `🎤 ${currentState.name}`;
    refreshCharacter3D();
    renderItemsGrid();
  };

  // Botão Paleta de Cores Lateral
  document.getElementById('btn-color').onclick = () => {
    audio.playPopSound(720);
    document.getElementById('color-palette-popup').classList.toggle('hidden');
  };

  // Inicialização Geral
  initColorPalette();
  renderCategories();
  renderItemsGrid();
  refreshCharacter3D();
  animate();
</script>
</body>
</html>
